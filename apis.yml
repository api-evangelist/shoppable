name: Shoppable
description: >-
  Shoppable is embeddable commerce infrastructure that lets shoppers buy any
  product from any retailer in a single universal cart without leaving the
  content they are in. Founded in 2011 by Heather Udo, the company powers
  off-site commerce across editorial content, social media, ads, connected TV,
  email, and emerging AI/agentic channels through a single integration. Its
  Shoppable Commerce API Suite (OpenAPI 3.0) exposes product lookup, catalog
  search, merchant data, order data, and a universal v6 checkout backed by
  Stripe tokenization, plus a hosted Model Context Protocol (MCP) server for
  agentic commerce. Shoppable holds four U.S. patents for universal checkout
  and is backed by 500 Global, MI Ventures, and Bodley Group.
